[current]
version = "us_diversified_50_v1"
maintenance_mode = "manual_curated"
target_size = 50
review_frequency = "quarterly_or_when_a_security_becomes_ineligible"

[current.inclusion]
country = "United States"
listing = "major U.S. exchange"
security_type = "operating company common equity"
minimum_trading_history_days = 300
minimum_median_daily_dollar_volume_usd = 10000000
requires_reliable_price_history = true
requires_basic_fundamental_coverage = true
sector_goal = "all 11 major equity sectors"

[current.exclusion]
exclude_otc = true
exclude_spacs = true
exclude_etfs = true
exclude_funds = true
exclude_preferred_shares = true
exclude_known_pending_delistings = true

[proposal_discovery]
status = "implemented_user_accepted"
candidate_source = "bounded Yahoo sector screens joined to Nasdaq Trader listings and SEC identities"
selection_frequency = "weekly_when_due_before_morning_report"
profiles = ["best_overall", "diversified"]
default_profile = "diversified"
default_target_size = 50
default_candidates_per_sector = 10
supported_scope = "Nasdaq, NYSE, NYSE American common/ordinary shares with verified 10-K reporting"
minimum_completed_sessions = 300
minimum_price_usd = 5
minimum_median_dollar_volume_20d_usd = 10000000
minimum_scoring_coverage = 0.60
activation = "explicit_user_approval_only"
approval_expiry_hours = 48
implementation = "src/stockrank/universe_discovery.py and universe_sources.py; descriptive policy, not an executable override"
change_control = "write a dated universe version; never rewrite prior run membership"
required_checks = [
  "active major-exchange listing",
  "security-type classification",
  "price and liquidity history",
  "minimum fundamental data coverage",
  "sector diversification",
  "corporate actions and ticker changes",
  "delisting and merger status",
]

[personal_user_universes]
status = "supported_by_explicit_user_configuration"
activation = "previewed and approved by the local user"
scope = "ranks only supplied tickers; does not discover candidates"
validation = "local schema/model checks plus optional live Yahoo price and SEC identity coverage"
history = "new universe identifier applies prospectively; prior runs remain unchanged"
full_automatic_policy_enforcement = "manual_customization_is_separate_from_bounded_discovery_eligibility"

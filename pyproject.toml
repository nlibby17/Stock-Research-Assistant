[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-research-assistant"
version = "0.6.0"
description = "Local, research-only stock screening and ranking application"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "requests>=2.32,<3",
  "streamlit>=1.42,<2",
  "yfinance>=0.2.54,<2",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.19,<3",
  "types-requests>=2.32,<3",
  "pytest>=8.3,<10",
  "ruff>=0.9,<1",
]

[project.scripts]
stockrank = "stockrank.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stockrank = ["web_assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
mypy_path = "$MYPY_CONFIG_FILE_DIR/src"
files = [
  "src/stockrank/scoring_inputs.py",
  "src/stockrank/scoring.py",
  "src/stockrank/pipeline.py",
  "src/stockrank/universe_sources.py",
]
# Analyze imported signatures, but report errors only in this bounded workstream.
follow_imports = "silent"
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_any_unimported = true

[[tool.mypy.overrides]]
module = ["stockrank.scoring_inputs", "stockrank.scoring", "stockrank.pipeline"]
disallow_any_generics = true
